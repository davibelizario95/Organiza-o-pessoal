// ---------- row <-> app object mapping ----------
function rowToLick(r) {
  return { id: r.id, name: r.name, artist: r.artist, difficulty: r.difficulty, tags: r.tags || [], targetBpm: r.target_bpm, link: r.link, notes: r.notes, status: r.status, dominatedAt: r.dominated_at, createdAt: r.created_at };
}
function lickToRow(l, userId) {
  return { id: l.id, user_id: userId, name: l.name, artist: l.artist || null, difficulty: l.difficulty || null, tags: l.tags || [], target_bpm: l.targetBpm || null, link: l.link || null, notes: l.notes || null, status: l.status || "quero", dominated_at: l.dominatedAt || null };
}
function rowToSession(r) {
  return { id: r.id, lickId: r.lick_id, date: r.date, durationSeconds: r.duration_seconds, bpmAchieved: r.bpm_achieved, rating: r.rating, notes: r.notes };
}
function sessionToRow(s, userId) {
  return { id: s.id || uid(), user_id: userId, lick_id: s.lickId, date: s.date, duration_seconds: s.durationSeconds || 0, bpm_achieved: s.bpmAchieved || null, rating: s.rating || null, notes: s.notes || null };
}

// ---------- data hooks ----------
function useLicks(userId) {
  const [licks, setLicks] = useState([]);
  const [loading, setLoading] = useState(true);
  async function load() {
    setLoading(true);
    const { data, error } = await supabase.from("licks").select("*").eq("user_id", userId).order("created_at", { ascending: false });
    if (error) console.error(error);
    setLicks(data ? data.map(rowToLick) : []);
    setLoading(false);
  }
  useEffect(() => { load(); }, [userId]);
  async function upsert(lick) {
    const row = lickToRow(Object.assign({ id: lick.id || uid() }, lick), userId);
    const { error } = await supabase.from("licks").upsert(row);
    if (error) console.error(error);
    await load();
  }
  async function remove(id) {
    const { data: mediaRows } = await supabase.from("media").select("storage_path").eq("lick_id", id);
    if (mediaRows && mediaRows.length) {
      await supabase.storage.from("media").remove(mediaRows.map(m => m.storage_path));
    }
    await supabase.from("licks").delete().eq("id", id);
    await load();
  }
  return { licks, loading, upsert, remove, reload: load };
}

function useSessions(userId) {
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);
  async function load() {
    setLoading(true);
    const { data, error } = await supabase.from("sessions").select("*").eq("user_id", userId).order("date", { ascending: false });
    if (error) console.error(error);
    setSessions(data ? data.map(rowToSession) : []);
    setLoading(false);
  }
  useEffect(() => { load(); }, [userId]);
  async function add(session) {
    const row = sessionToRow(session, userId);
    const { error } = await supabase.from("sessions").insert(row);
    if (error) console.error(error);
    await load();
  }
  return { sessions, loading, add, reload: load };
}

}

// ---------- media (Supabase Storage) ----------
async function uploadMedia(file, lickId, userId) {
  const path = userId + "/" + lickId + "/" + uid() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const { error: upErr } = await supabase.storage.from("media").upload(path, file, { contentType: file.type });
  if (upErr) throw upErr;
  const { error } = await supabase.from("media").insert({
    id: uid(), user_id: userId, lick_id: lickId, storage_path: path,
    filename: file.name, mime_type: file.type, type: file.type.indexOf("video") === 0 ? "video" : "audio",
  });
  if (error) throw error;
}
async function fetchMediaForLick(lickId) {
  const { data, error } = await supabase.from("media").select("*").eq("lick_id", lickId).order("created_at", { ascending: true });
  if (error) { console.error(error); return []; }
  return data;
}
async function getMediaSignedUrl(path) {
  const { data, error } = await supabase.storage.from("media").createSignedUrl(path, 3600);
  if (error) { console.error(error); return null; }
  return data.signedUrl;
}
async function deleteMediaItem(item) {
  await supabase.storage.from("media").remove([item.storage_path]);
  await supabase.from("media").delete().eq("id", item.id);
}

// ---------- metronome / stopwatch / recorder (unchanged, local only) ----------
function useMetronome(initialBpm) {
  const [bpm, setBpm] = useState(initialBpm || 100);
  const [playing, setPlaying] = useState(false);
  const ctxRef = useRef(null);
  function click() {
    const ctx = ctxRef.current;
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 1400;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.04);
  }
  useEffect(() => {
    if (!playing) return;
    if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    click();
    const id = setInterval(click, 60000 / bpm);
    return () => clearInterval(id);
  }, [playing, bpm]);
  return { bpm, setBpm, playing, toggle: () => setPlaying(p => !p) };
}
function useStopwatch() {
  const [seconds, setSeconds] = useState(0);
  const [running, setRunning] = useState(false);
  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setSeconds(s => s + 1), 1000);
    return () => clearInterval(id);
  }, [running]);
  return { seconds, running, start: () => setRunning(true), pause: () => setRunning(false), reset: () => { setSeconds(0); setRunning(false); } };
}
function useRecorder() {
  const [recording, setRecording] = useState(false);
  const [audioUrl, setAudioUrl] = useState(null);
  const [error, setError] = useState(null);
  const mrRef = useRef(null);
  const chunksRef = useRef([]);
  async function start() {
    setError(null); setAudioUrl(null);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mr = new MediaRecorder(stream);
      chunksRef.current = [];
      mr.ondataavailable = e => chunksRef.current.push(e.data);
      mr.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: "audio/webm" });
        setAudioUrl(URL.createObjectURL(blob));
        stream.getTracks().forEach(t => t.stop());
      };
      mr.start(); mrRef.current = mr; setRecording(true);
    } catch (e) { setError("Não consegui acessar o microfone. Verifique a permissão do navegador."); }
  }
  function stop() { mrRef.current && mrRef.current.stop(); setRecording(false); }
  function reset() { setAudioUrl(null); setError(null); }
  return { recording, audioUrl, error, start, stop, reset };
}

function computeStreak(sessions) {
  const days = new Set(sessions.map(s => s.date.slice(0, 10)));
  let cursor = new Date();
  const key = () => cursor.toISOString().slice(0, 10);
  if (!days.has(key())) cursor.setDate(cursor.getDate() - 1);
  let streak = 0;
  while (days.has(key())) { streak++; cursor.setDate(cursor.getDate() - 1); }
  return streak;
}
function last14Days(sessions) {
  const days = new Set(sessions.map(s => s.date.slice(0, 10)));
  const arr = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = d.toISOString().slice(0, 10);
    arr.push({ key: k, practiced: days.has(k), dayNum: 14 - i });
  }
  return arr;
}

function MiniLineChart({ data, dataKey, color, yDomain }) {
  const width = 400, height = 140;
  const valid = data.filter(d => d[dataKey] !== null && d[dataKey] !== undefined);
  if (valid.length === 0) return h("div", { className: "empty" }, "Sem dados suficientes ainda.");
  const values = valid.map(d => d[dataKey]);
  const minV = yDomain ? yDomain[0] : Math.min(...values);
  const maxV = yDomain ? yDomain[1] : Math.max(...values);
  const range = (maxV - minV) || 1;
  const stepX = data.length > 1 ? width / (data.length - 1) : width;
  const points = data.map((d, i) => {
    const val = d[dataKey];
    const y = (val === null || val === undefined) ? null : height - ((val - minV) / range) * (height - 16) - 8;
    return { x: i * stepX, y, val, label: d.date };
  });
  const polyPoints = points.filter(p => p.y !== null).map(p => p.x + "," + p.y).join(" ");
  return h("div", null,
    h("svg", { viewBox: "0 0 " + width + " " + height, style: { width: "100%", height: 140, display: "block" }, preserveAspectRatio: "none" },
      h("polyline", { points: polyPoints, fill: "none", stroke: color, strokeWidth: 2 }),
      points.filter(p => p.y !== null).map((p, i) => h("circle", { key: i, cx: p.x, cy: p.y, r: 3, fill: color }))
    ),
    h("div", { className: "chart-axis" },
      h("span", null, points[0] ? points[0].label : ""),
      h("span", null, points[points.length - 1] ? points[points.length - 1].label : "")
    )
  );
}

function App(props) {
  const { userId, userEmail } = props;
  const { licks, loading: licksLoading, upsert: upsertLick, remove: removeLick } = useLicks(userId);
  const { sessions, loading: sessionsLoading, add: addSession } = useSessions(userId);
  const [goal, setGoal] = useGoal(userId);
  const [tab, setTab] = useState("home");
  const [editingLick, setEditingLick] = useState(null);
  const [activeLickId, setActiveLickId] = useState(null);
  const [mediaModalLick, setMediaModalLick] = useState(null);
  const [mediaVersion, setMediaVersion] = useState(0);

  const ready = !licksLoading && !sessionsLoading;
  const activeLick = licks.find(l => l.id === activeLickId) || null;
  const openMedia = (lick) => setMediaModalLick(lick);
  const closeMedia = () => { setMediaModalLick(null); setMediaVersion(v => v + 1); };

  function saveLick(data) {
    const prev = licks.find(l => l.id === data.id);
    const wasNotDominado = !prev || prev.status !== "dominado";
    const dominatedAt = (data.status === "dominado" && wasNotDominado) ? new Date().toISOString() : (prev ? prev.dominatedAt : null);
    upsertLick(Object.assign({}, data, { dominatedAt }));
    setEditingLick(null);
  }
  function deleteLick(id) {
    removeLick(id);
    if (activeLickId === id) setActiveLickId(null);
  }
  function changeStatus(id, status) {
    const lick = licks.find(l => l.id === id);
    saveLick(Object.assign({}, lick, { status }));
  }
  function saveSession(session) { addSession(session); }

  const streak = useMemo(() => computeStreak(sessions), [sessions]);
  const days14 = useMemo(() => last14Days(sessions), [sessions]);
  const sessionsThisWeek = useMemo(() => sessions.filter(s => Date.now() - new Date(s.date).getTime() <= 7 * 24 * 3600 * 1000).length, [sessions]);

  return h("div", { className: "app" },
    h("header", { className: "topbar" },
      h("div", { className: "brand" },
        h("span", { className: "brand-emoji" }, "🎸"),
        h("div", null, h("div", { className: "brand-title" }, "Trastes"), h("div", { className: "brand-sub" }, "seu diário de prática"))
      ),
      h("div", { className: "topbar-right" },
        h("span", { className: "user-pill" }, userEmail),
        h("div", { className: "streak-pill" }, "🔥 ", streak),
        h("button", { className: "ghost-btn", onClick: () => supabase.auth.signOut() }, "Sair")
      )
    ),
    h("nav", { className: "tabs" },
      [{ id: "home", label: "Início" }, { id: "library", label: "Biblioteca" }, { id: "practice", label: "Praticar" }, { id: "progress", label: "Evolução" }].map(t =>
        h("button", { key: t.id, className: "tab-btn" + (tab === t.id ? " active" : ""), onClick: () => setTab(t.id) }, t.label)
      )
    ),
    h("main", null,
      !ready && h("div", { className: "empty" }, "Carregando seus dados..."),
      ready && tab === "home" && h(HomeView, { licks, sessions }),
      ready && tab === "library" && h(LibraryView, {
        licks, onNew: () => setEditingLick({}), onEdit: l => setEditingLick(l),
        onDelete: deleteLick, onStatusChange: changeStatus,
        onPractice: l => { setActiveLickId(l.id); setTab("practice"); },
        onOpenMedia: openMedia, mediaVersion
      }),
      ready && tab === "practice" && h(PracticeView, {
        licks, activeLick, setActiveLickId, onSaveSession: saveSession, onStatusChange: changeStatus,
        onOpenMedia: openMedia, mediaVersion
      }),
      ready && tab === "progress" && h(ProgressView, {
        licks, sessions, days14, goal, setGoal, sessionsThisWeek, streak
      })
    ),
    editingLick !== null && h(LickForm, { initial: editingLick, userId, onCancel: () => setEditingLick(null), onSave: saveLick }),
    mediaModalLick && h(MediaModal, { lick: mediaModalLick, userId, onClose: closeMedia })
  );
}

function MonthCalendar(props) {
  const { licks, sessions } = props;
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const monthKey = year + "-" + String(month + 1).padStart(2, "0");
  const monthLabel = now.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startWeekday = firstDay.getDay();
  const practicedDays = new Set(sessions.map(s => s.date.slice(0, 10)));
  const dominatedByDay = {};
  licks.forEach(l => {
    if (l.dominatedAt && l.dominatedAt.slice(0, 7) === monthKey) {
      const d = l.dominatedAt.slice(0, 10);
      (dominatedByDay[d] = dominatedByDay[d] || []).push(l.name);
    }
  });
  const today = todayStr();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const key = monthKey + "-" + String(d).padStart(2, "0");
    cells.push({ day: d, key, practiced: practicedDays.has(key), dominated: !!dominatedByDay[key], names: dominatedByDay[key] || [], isToday: key === today });
  }
  const weekdayLabels = ["D", "S", "T", "Q", "Q", "S", "S"];
  const dominatedThisMonth = Object.keys(dominatedByDay).sort().flatMap(d => dominatedByDay[d].map(name => ({ date: d, name })));

  return h("div", null,
    h("div", { className: "panel-title" }, "Linha do tempo — " + monthLabel),
    h("div", { className: "month-weekdays" }, weekdayLabels.map((w, i) => h("div", { key: i }, w))),
    h("div", { className: "month-grid" }, cells.map((c, i) =>
      c === null
        ? h("div", { key: i, className: "month-cell empty-cell" })
        : h("div", {
            key: i,
            className: "month-cell" + (c.practiced ? " practiced" : "") + (c.dominated ? " dominated" : "") + (c.isToday ? " today" : ""),
            title: c.names.length ? c.names.join(", ") : undefined
          },
            h("span", { className: "month-cell-daynum" }, c.day),
            c.practiced && h("span", { className: "month-cell-dot" })
          )
    )),
    h("div", { className: "month-legend" },
      h("span", null, h("span", { className: "legend-dot practiced" }), " praticou"),
      h("span", null, h("span", { className: "legend-dot dominated" }), " lick dominado")
    ),
    dominatedThisMonth.length > 0 && h("div", { style: { marginTop: 14 } },
      h("div", { className: "hint", style: { marginBottom: 6 } }, "Dominados este mês:"),
      h("ul", { className: "dominado-list" }, dominatedThisMonth.map((it, i) =>
        h("li", { key: i }, h("span", null, it.name), h("span", { className: "hint" }, fmtDate(it.date)))
      ))
    )
  );
}

        h("div", { className: "metronome" },
          h("div", { className: "bpm-display" }, metronome.bpm, h("span", null, " BPM")),
          h("input", { type: "range", min: "40", max: "220", value: metronome.bpm, onChange: e => metronome.setBpm(Number(e.target.value)) }),
          h("button", { className: "click-btn" + (metronome.playing ? " active" : ""), onClick: metronome.toggle }, metronome.playing ? "⏹ Parar" : "▶ Tocar clique"),
          activeLick.targetBpm && h("div", { className: "hint" }, "alvo: " + activeLick.targetBpm + " BPM")
        )
      ),
      h("div", { className: "panel" },
        h("div", { className: "panel-title" }, "Tempo de prática"),
        h("div", { className: "stopwatch" },
          h("div", { className: "clock" }, fmtClock(stopwatch.seconds)),
          !stopwatch.running ? h("button", { className: "primary-btn", onClick: stopwatch.start }, "▶ Iniciar") : h("button", { className: "ghost-btn", onClick: stopwatch.pause }, "⏸ Pausar")
        )
      ),
      h("div", { className: "panel wide" },
        h("div", { className: "panel-title" }, "Gravação"),
        recorder.error && h("div", { className: "error-msg" }, recorder.error),
        !recorder.audioUrl
          ? h("button", { className: "record-btn" + (recorder.recording ? " active" : ""), onClick: recorder.recording ? recorder.stop : recorder.start }, recorder.recording ? "⏹ Parar gravação" : "🎤 Gravar")
          : h("div", { className: "recording-result" },
              h("audio", { controls: true, src: recorder.audioUrl }),
              h("a", { className: "ghost-btn", href: recorder.audioUrl, download: activeLick.name.replace(/\s+/g, "_") + "_" + todayStr() + ".webm" }, "⬇ Baixar"),
              h("button", { className: "ghost-btn", onClick: recorder.reset }, "Regravar")
            ),
        h("div", { className: "hint" }, "Só o histórico da sessão fica salvo — essa gravação de prática não é armazenada. Baixe se quiser guardar.")
      ),
      h("div", { className: "panel wide" },
        h("div", { className: "panel-title" }, "Avaliação da sessão"),
        h("div", { className: "form-row" },
          h("div", null, h("label", null, "BPM alcançado"), h("input", { type: "number", value: bpmAchieved, onChange: e => setBpmAchieved(e.target.value), placeholder: "ex: 110" })),
          h("div", null, h("label", null, "Autoavaliação"), h(StarRating, { value: rating, onChange: setRating }))
        ),
        h("label", null, "Observações"),
        h("textarea", { rows: 2, value: notes, onChange: e => setNotes(e.target.value), placeholder: "ex: travei na descida, bend ficou mais limpo" }),
        h("div", { className: "modal-actions" },
          activeLick.status !== "dominado" && h("button", { type: "button", className: "ghost-btn", onClick: () => onStatusChange(activeLick.id, "dominado") }, "Marcar como dominado"),
          h("button", { className: "primary-btn", onClick: saveSession }, "Salvar sessão")
        )
      ),
      h(ReferencePanel, { lick: activeLick, onOpenMedia, mediaVersion })
    )
  );
}

function ReferencePanel(props) {
  const { lick, onOpenMedia, mediaVersion } = props;
  const [items, setItems] = useState([]);
  const [urls, setUrls] = useState({});
  useEffect(() => {
    let cancelled = false;
    fetchMediaForLick(lick.id).then(async list => {
      if (cancelled) return;
      setItems(list);
      const urlMap = {};
      for (const it of list) urlMap[it.id] = await getMediaSignedUrl(it.storage_path);
      if (!cancelled) setUrls(urlMap);
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [lick.id, mediaVersion]);

  return h("div", { className: "panel wide" },
    h("div", { className: "panel-title" }, "Referências (vídeo/áudio)"),
    h("button", { className: "ghost-btn", onClick: () => onOpenMedia(lick) }, "📎 Gerenciar referências"),
    items.length === 0
      ? h("div", { className: "empty", style: { marginTop: 10 } }, "Nenhuma referência anexada a este lick ainda.")
      : h("div", { className: "media-list", style: { marginTop: 10 } }, items.map(it =>
          h("div", { key: it.id, className: "media-item" },
            h("div", { className: "media-item-name" }, it.filename),
            it.type === "video"
              ? h("video", { controls: true, src: urls[it.id], style: { width: "100%", borderRadius: 8, maxHeight: 220 } })
              : h("audio", { controls: true, src: urls[it.id], style: { width: "100%" } })
          )))
  );
}

function MediaModal(props) {
  const { lick, userId, onClose } = props;
  const [items, setItems] = useState([]);
  const [urls, setUrls] = useState({});
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function refresh() {
    const list = await fetchMediaForLick(lick.id);
    setItems(list);
    const urlMap = {};
    for (const it of list) urlMap[it.id] = await getMediaSignedUrl(it.storage_path);
    setUrls(urlMap);
  }
  useEffect(() => { refresh().then(() => setLoading(false)); }, [lick.id]);

  async function handleFiles(fileList) {
    setBusy(true); setError(null);
    for (const file of Array.from(fileList)) {
      try { await uploadMedia(file, lick.id, userId); }
      catch (err) { console.error(err); setError("Falha ao enviar: " + (err.message || "erro desconhecido")); }
    }
    await refresh();
    setBusy(false);
  }
  async function handleDelete(item) {
    await deleteMediaItem(item);
    await refresh();
  }

  return h("div", { className: "modal-overlay", onClick: onClose },
    h("div", { className: "modal", onClick: e => e.stopPropagation() },
      h("div", { className: "modal-header" },
        h("h3", null, "Referências — " + lick.name),
        h("button", { className: "icon-btn", onClick: onClose }, "✕")
      ),
      h("label", null, "Adicionar vídeo ou áudio do seu dispositivo"),
      h("input", { type: "file", accept: "video/*,audio/*", multiple: true, disabled: busy, onChange: e => handleFiles(e.target.files) }),
      h("div", { className: "hint" }, "Salvo na nuvem, vinculado à sua conta. Prefira clipes curtos; arquivos grandes demoram mais para enviar."),
      error && h("div", { className: "error-msg" }, error),
      loading ? h("div", { className: "empty", style: { marginTop: 12 } }, "Carregando...")
        : items.length === 0 ? h("div", { className: "empty", style: { marginTop: 12 } }, "Nenhuma referência ainda.")
        : h("div", { className: "media-list", style: { marginTop: 12 } }, items.map(it =>
            h("div", { key: it.id, className: "media-item" },
              h("div", { className: "media-item-name" }, it.filename),
              it.type === "video"
                ? h("video", { controls: true, src: urls[it.id], style: { width: "100%", borderRadius: 8, maxHeight: 260 } })
                : h("audio", { controls: true, src: urls[it.id], style: { width: "100%" } }),
              h("div", { style: { marginTop: 6 } }, h("button", { className: "icon-btn danger", onClick: () => handleDelete(it) }, "🗑 Remover"))
            )))
    )
  );
}

function Fretboard(props) {
  const markerPositions = new Set([3, 5, 7, 9, 12]);
  return h("div", { className: "fretboard" }, props.days14.map(d =>
    h("div", { key: d.key, className: "fret" + (markerPositions.has(d.dayNum) ? " marker" : "") },
      h("div", { className: "dot" + (d.practiced ? " lit" : ""), title: d.key }))));
}

function ProgressView(props) {
  const { licks, sessions, days14, goal, setGoal, sessionsThisWeek, streak } = props;
  const [selectedId, setSelectedId] = useState(licks[0] ? licks[0].id : "");
  const dominados = licks.filter(l => l.status === "dominado").sort((a, b) => new Date(b.dominatedAt || 0) - new Date(a.dominatedAt || 0));
  const chartData = useMemo(() => sessions.filter(s => s.lickId === selectedId).slice().sort((a, b) => new Date(a.date) - new Date(b.date)).map(s => ({ date: fmtDate(s.date), bpm: s.bpmAchieved, rating: s.rating })), [sessions, selectedId]);
  const totalSessions = sessions.length;
  const totalMinutes = Math.round(sessions.reduce((a, s) => a + (s.durationSeconds || 0), 0) / 60);

  return h("div", null,
    h("div", { className: "section-header" }, h("h2", null, "Evolução")),
    h("div", { className: "panel" }, h("div", { className: "panel-title" }, "Últimos 14 dias"), h(Fretboard, { days14 })),
    h("div", { className: "stats-row" },
      h("div", { className: "stat-card" }, h("div", { className: "stat-label" }, "🔥 streak"), h("div", { className: "stat-value" }, streak)),
      h("div", { className: "stat-card" }, h("div", { className: "stat-label" }, "sessões totais"), h("div", { className: "stat-value" }, totalSessions)),
      h("div", { className: "stat-card" }, h("div", { className: "stat-label" }, "minutos praticados"), h("div", { className: "stat-value" }, totalMinutes)),
      h("div", { className: "stat-card" }, h("div", { className: "stat-label" }, "licks dominados"), h("div", { className: "stat-value" }, dominados.length))
    ),
    h("div", { className: "panel" },
      h("div", { className: "stat-label" }, "🎯 meta semanal"),
      h("div", { className: "stat-value" }, sessionsThisWeek, "/",
        h("input", { type: "number", min: "1", value: goal, onChange: e => setGoal(Number(e.target.value) || 1), className: "goal-input" }),
        h("span", { style: { fontSize: 12, color: "#9CAA9F", marginLeft: 8 } }, "sessões esta semana"))
    ),
    licks.length > 0 && h("div", { className: "panel" },
      h("div", { className: "panel-title" }, "Progresso por lick"),
      h("select", { className: "lick-select", value: selectedId, onChange: e => setSelectedId(e.target.value) }, licks.map(l => h("option", { key: l.id, value: l.id }, l.name))),
      chartData.length === 0
        ? h("div", { className: "empty" }, "Nenhuma sessão registrada para este lick ainda.")
        : h("div", { className: "charts" },
            h("div", null, h("div", { className: "chart-label" }, "BPM ao longo do tempo"), h(MiniLineChart, { data: chartData, dataKey: "bpm", color: "#E8A33D" })),
            h("div", null, h("div", { className: "chart-label" }, "Autoavaliação ao longo do tempo"), h(MiniLineChart, { data: chartData, dataKey: "rating", color: "#7BAE7F", yDomain: [0, 5] }))
          )
    ),
    h("div", { className: "panel" },
      h("div", { className: "panel-title" }, "Licks dominados"),
      dominados.length === 0
        ? h("div", { className: "empty" }, "Nenhum lick dominado ainda. Continue praticando!")
        : h("ul", { className: "dominado-list" }, dominados.map(l => h("li", { key: l.id }, h("span", null, l.name), h("span", { className: "hint" }, l.dominatedAt ? fmtDate(l.dominatedAt) : ""))))
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(Root));

} catch (err) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;max-width:600px;margin:40px auto;font-family:sans-serif;color:#F2EFE6;background:#1F2A24;border:1px solid #D1453D;border-radius:10px;">'
    + '<strong>Erro ao iniciar o app:</strong><br><br>'
    + '<code style="white-space:pre-wrap;word-break:break-word;">' + (err && err.message ? err.message : String(err)) + '</code>'
    + '<br><br>Tira um print dessa mensagem e manda pro Claude.</div>';
  console.error(err);
}

</script>
</body>
</html>
